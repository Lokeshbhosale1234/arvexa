name: Arvexa checks
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: arvexa-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: arvexa_test
          POSTGRES_USER: arvexa
          POSTGRES_PASSWORD: test_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arvexa -d arvexa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CAPTURE_INTEGRATION: 'true'
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/arvexa_test
      SPRING_DATASOURCE_USERNAME: arvexa
      SPRING_DATASOURCE_PASSWORD: test_only_password
      JWT_SECRET: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      GEMINI_API_KEY: ''
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B verify
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: arvexa-capture-debug-apk
          path: Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
