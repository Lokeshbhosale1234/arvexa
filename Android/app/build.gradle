plugins { id 'com.android.application' }
android {
    namespace 'com.arvexa.capture'
    compileSdk 35
    defaultConfig {
        applicationId 'com.arvexa.capture'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    // One parser implementation: no separate, drifting Android regex copy.
    sourceSets.main.java.srcDir '../../Backend/src/main/java/com/fintech/capture/parser'
    lint { abortOnError true }
}
dependencies {
    implementation 'androidx.work:work-runtime:2.10.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    testImplementation 'junit:junit:4.13.2'
}
